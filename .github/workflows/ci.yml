name: CI — Lint & Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Supabase migration filenames
        shell: bash
        run: |
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)

          if (( ${#migrations[@]} == 0 )); then
            echo "::error::No active Supabase migrations found."
            exit 1
          fi

          for file in "${migrations[@]}"; do
            name="${file##*/}"
            if [[ ! "$name" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=$file::Migration filename must match YYYYMMDDHHMMSS_name.sql"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # `npx tsc --noEmit` NÃO checava nada: o tsconfig.json da raiz tem
      # "files": [] e só referencia os projetos reais, e sem `-b` o tsc não
      # segue as referências — checava zero arquivo e passava sempre.
      # Verificado com um erro deliberado (string em number): saída vazia.
      - name: TypeScript type-check
        run: npm run typecheck

      - name: Run tests (Vitest) with coverage
        run: npm run test:coverage -- --run

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build (production)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 7
