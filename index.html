<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Acordos</title>
    <meta name="description" content="Sistema profissional de Gestão de Acordos Financeiros" />
    <meta name="author" content="Gestão de Acordos" />

    <!-- Favicon (o app troca por empresa: PaguePlay verde / BookPlay azul) -->
    <link rel="icon" type="image/png" href="/logo-pagueplay.png" />

    <!--
      App instalável (PWA). Um ícone só para as duas empresas — ver
      docs/mobile/gerar-icone.py. O manifest abre direto na tela mínima (/m).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Acordos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // O app instalável mora em app.gestaodeacordos.com.br (07/10/2026). No
      // endereço do site o navegador não oferece «instalar»: sem manifest e sem
      // as marcas de app do iPhone. localhost fica como app, para desenvolver.
      (function () {
        var h = location.hostname.toLowerCase();
        if (/^app\./.test(h) || h === 'localhost' || h === '127.0.0.1') return;
        document.querySelectorAll(
          'link[rel="manifest"], meta[name="apple-mobile-web-app-capable"], meta[name="mobile-web-app-capable"]'
        ).forEach(function (el) { el.remove(); });
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:title" content="Gestão de Acordos" />
    <meta property="og:description" content="Sistema profissional de Gestão de Acordos Financeiros" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo-pagueplay.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1e40af" />

    <!--
      Tema antes da primeira pintura. O next-themes só aplica a classe depois
      que o React monta (o script dele não roda num app sem SSR): quem usa tema
      escuro via um clarão branco a cada carga. Este bloco repete a decisão dele
      — mesma chave `theme`, mesmo «Sistema» — e o next-themes assume a partir
      daí. A lista de temas é cópia de `NOMES_TEMAS` (src/lib/temas.ts).
    -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var validos = ['light', 'rosa', 'verde', 'azul', 'dark', 'dark-grey', 'deep-blue'];
          var t = localStorage.getItem('theme') || 'system';
          if (t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          // O app do celular é só claro (temaSoClaro, src/lib/mobile/preferencia.ts).
          var soClaro = location.hostname.toLowerCase().indexOf('app.') === 0
            || /^#\/m(\/|\?|$)/.test(location.hash);
          if (soClaro) { t = 'light'; d.classList.add('no-app'); }
          if (validos.indexOf(t) !== -1) d.classList.add(t);
          if (localStorage.getItem('menuLateralEscuro') === 'true') d.classList.add('menu-lateral-escuro');
        } catch (e) { /* modo privado: fica o claro */ }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
